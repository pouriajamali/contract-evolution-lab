name: Native contract rollout packages and bounded faults
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify aggregation and attestations without creating a release
        type: boolean
        default: false
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Record isolated legacy source job budget
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CE07_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Locked source tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -ErrorAction Stop | Out-Null
          dotnet restore tests/Core.Tests/Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Core.Tests/Core.Tests.csproj -c Release --no-restore -- -noLogo -result-xml artifacts/unit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch exact official Buf tool
        run: python tools/fetch_buf.py --out artifacts/buf
      - name: Build exact clean native package and descriptors
        shell: pwsh
        run: |
          $buf = @(Get-ChildItem artifacts/buf -File | Where-Object { $_.Name -like 'buf-*' })
          if ($buf.Count -ne 1) { throw 'One pinned Buf binary required' }
          python tools/package.py --rid ${{ matrix.rid }} --commit ${{ github.sha }} --work artifacts/build --out artifacts/delivery --buf $buf[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Expression-only dependency notice regressions
        run: python tools/test_notices.py --out artifacts/notices-tests
      - name: Canonical pinned-key and attacker-signature regressions
        run: python tools/test_verifier.py --out artifacts/verifier-tests
      - name: Current advisory data for locked dependencies
        run: python tools/audit_dependencies.py --out artifacts/dependency-advisories.json
      - name: Extract and execute the actual package
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem artifacts/delivery -File)
          if ($archive.Count -ne 1) { throw 'Exactly one archive required' }
          python tools/extract_package.py --archive $archive[0].FullName --out 'artifacts/extracted with spaces'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = @(Get-ChildItem 'artifacts/extracted with spaces' -Directory)
          if ($package.Count -ne 1) { throw 'Exactly one package root required' }
          python tools/check_package.py --package $package[0].FullName --commit '${{ github.sha }}' --out artifacts/package-checks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One frozen preview.2 Linux semantic and migration profile
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $runId = 'ce07-' + [guid]::NewGuid().ToString('N')
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ce07-profile'
          $out = Join-Path $root $runId
          python tools/run_semantic_profile.py --ci --inputs (Join-Path $root inputs) --out $out --run-id $runId
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete fixed profile; retain private diagnostics' }
          # Retain the existing bounded case-summary proof, never raw history.
          $proof = Join-Path $out 'private/integration/receipt.json'
          if ((Get-Item -LiteralPath $proof).Length -gt 262144) { throw 'Legacy summary exceeds bound' }
          $receipt = Get-Content -Raw -LiteralPath $proof | ConvertFrom-Json
          $keys = @('status','clientOs','caseCount','cases','effectCount','total','finalStage','legacyInputGuard','immutableApplicationFiles','normalUnknownResolutionAttempts','durationSeconds')
          if (@(Compare-Object ($receipt.PSObject.Properties.Name | Sort-Object) ($keys | Sort-Object)).Count -ne 0) { throw 'Unexpected legacy summary fields' }
          if ($receipt.status -ne 'PASS' -or $receipt.caseCount -ne 15 -or $receipt.effectCount -ne 52 -or $receipt.total -ne 3556 -or $receipt.finalStage -ne 2) { throw 'Exact profile summary mismatch' }
          New-Item -ItemType Directory -Path artifacts/integration -ErrorAction Stop | Out-Null
          $receipt | ConvertTo-Json -Depth 16 | Set-Content -Encoding utf8 -LiteralPath artifacts/integration/receipt.json
          $public = @('admission.sanitized.json','resource.sanitized.json','semantic-matrix.json','receipt.sanitized.json')
          $bytes = 0
          foreach ($name in $public) {
            $file = Get-Item -LiteralPath (Join-Path $out $name)
            if ($file.Length -gt 262144) { throw 'Sanitized receipt exceeds bound' }
            $bytes += $file.Length
          }
          if ($bytes -gt 1048576) { throw 'Total sanitized proof cap' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: bundle-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - name: Bound selected proof artifact bytes
        shell: pwsh
        run: |
          $paths = @('artifacts/unit.xml','artifacts/package-checks.json','artifacts/dependency-advisories.json','artifacts/notices-tests/receipt.json','artifacts/verifier-tests/receipt.json','artifacts/build/archive.json','artifacts/build/toolchain-check.json','artifacts/build/contract-checks/receipt.json','artifacts/integration/receipt.json')
          $total = 0
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) { $total += (Get-Item -LiteralPath $path).Length }
          }
          $profileRoot = 'artifacts/ce07-profile'
          if (Test-Path -LiteralPath $profileRoot) {
            $runs = @(Get-ChildItem -LiteralPath $profileRoot -Directory | Where-Object { $_.Name -match '^ce07-[0-9a-f]{32}$' })
            if ($runs.Count -gt 1) { throw 'Only one integration run per native job' }
            foreach ($run in $runs) {
              foreach ($name in @('admission.sanitized.json','resource.sanitized.json','semantic-matrix.json','receipt.sanitized.json')) {
                $total += (Get-Item -LiteralPath (Join-Path $run.FullName $name)).Length
              }
            }
          }
          if ($total -gt 8388608) { throw 'Selected proof artifact exceeds8MiB; do not upload' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/unit.xml
            artifacts/package-checks.json
            artifacts/dependency-advisories.json
            artifacts/notices-tests/receipt.json
            artifacts/verifier-tests/receipt.json
            artifacts/build/archive.json
            artifacts/build/toolchain-check.json
            artifacts/build/contract-checks/receipt.json
            artifacts/integration/receipt.json
            artifacts/ce07-profile/ce07-*/admission.sanitized.json
            artifacts/ce07-profile/ce07-*/resource.sanitized.json
            artifacts/ce07-profile/ce07-*/semantic-matrix.json
            artifacts/ce07-profile/ce07-*/receipt.sanitized.json
          if-no-files-found: error
  aggregate:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_release == true
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: v0.1.0-preview.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify executed native archives and exact Git source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Attest exact archive digests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: verified-release-candidate
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish tested preview without rebuilding
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
          test "$ACTUAL_TAG" = "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --prerelease --title "$RELEASE_TAG - Contract Evolution & Safe Rollout Lab" --notes-file docs/RELEASE.md
