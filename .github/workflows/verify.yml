           return json.loads(b.decode("utf-8-sig"),object_pairs_hook=unique_pairs,parse_constant=constant)
          def check(v,s,c,p="$"):
           global RULE
           RULE=p
           if "literal" in s:need(type(v) is type(s["literal"]) and v==s["literal"],"LITERAL")
           elif "context" in s:need(type(v) is str and v==c[s["context"]])
           elif "pattern" in s:need(type(v) is str and len(v)<=512 and re.fullmatch(s["pattern"],v,flags=re.ASCII) is not None)
           elif "integer" in s:need(type(v) is int and s["integer"][0]<=v<=s["integer"][1])
           elif "number" in s:need(type(v) in (int,float) and math.isfinite(v) and s["number"][0]<=v<=s["number"][1])
           elif "numericText" in s:
            need(type(v) is str and re.fullmatch(r"[0-9]{1,3}(?:\.[0-9]{1,3})?",v) is not None)
            need(s["numericText"][0]<=float(v)<=s["numericText"][1])
           elif "object" in s:
            need(type(v) is dict,"TYPE");need(set(v)==set(s["object"]),"UNKNOWN_FIELD")
            for k,t in s["object"].items():check(v[k],t,c,p+"/"+k)
           elif "tuple" in s:
            need(type(v) is list and len(v)==len(s["tuple"]))
            for i,(a,b) in enumerate(zip(v,s["tuple"])):check(a,b,c,p+"/"+str(i))
           elif "array" in s:
            need(type(v) is list and s["count"][0]<=len(v)<=s["count"][1])
            for a in v:check(a,s["array"],c,p+"/[]")
            if s.get("unique"):need(len(v)==len(set(v)))
           else:raise ValueError("Invalid inactive contract rule")
          def identity(c):
           keys={"repository","runId","attempt","job","sourceCommit","os","rid","profileRun","unit","controlGroup"}
           need(type(c) is dict and set(c)==keys)
           need(c["repository"]==REPO and c["job"]=="verify")
           for k in ("runId","attempt"):need(type(c[k]) is str and re.fullmatch("[1-9][0-9]{0,19}",c[k]) is not None)
           need(type(c["sourceCommit"]) is str and re.fullmatch("[0-9a-f]{40}",c["sourceCommit"]) is not None)
           need(c["os"] in ("Linux","Windows"))
           need(c["rid"]==("linux-x64" if c["os"]=="Linux" else "win-x64"))
           if c["os"]=="Linux":
            need(type(c["profileRun"]) is str and re.fullmatch("ce07-[0-9a-f]{32}",c["profileRun"]) is not None)
            need(c["unit"]=="contract-evolution-07-"+c["profileRun"][5:]+".service")
            need(c["controlGroup"]=="/system.slice/"+c["unit"])
           else:need(c["profileRun"]==c["unit"]==c["controlGroup"]=="")
           return c
          def xml_check(b,c):
           global RULE
           RULE="xml/tree"
           p=expat.ParserCreate()
           def reject(*_):raise Reject("XML_METADATA")
           p.CommentHandler=reject;p.ProcessingInstructionHandler=reject
           p.XmlDeclHandler=lambda version,encoding,standalone: need(version=="1.0" and encoding in (None,"utf-8","UTF-8") and standalone==-1)
           p.StartDoctypeDeclHandler=reject;p.EntityDeclHandler=reject;p.ExternalEntityRefHandler=reject
           p.Parse(b,True)
