name: Native contract rollout packages and bounded faults
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify aggregation and attestations without creating a release
        type: boolean
        default: false
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Record isolated legacy source job budget
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CE07_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.403'
          skip-lts-prepass: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Locked source tests
        shell: python
        run: |
          """Inactive unit-only controller; synthetic tests import this without executing dotnet."""
          import json,os,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          SDK="10.0.403";RUNTIME="10.0.14"
          ENV14="64-bit (x64) .NET 10.0.14 [collection-per-class, parallel (collections, 4 threads)]"
          class UnitReject(Exception):
           def __init__(self,code):self.code=code
          def need(ok,code):
           if not ok:raise UnitReject(code)
          def selection(sdk,inventory,root,osname):
           need(type(sdk) is str and sdk.strip()==SDK,"SDK_SELECTION")
           def norm(x):return x.replace("\\","/").rstrip("/").casefold() if osname=="Windows" else x.rstrip("/")
           target=norm(str(root)+"/shared/Microsoft.NETCore.App")
           found=False
           for line in inventory.splitlines():
            if line.startswith("Microsoft.NETCore.App "+RUNTIME+" [") and line.endswith("]"):
             found|=norm(line[len("Microsoft.NETCore.App "+RUNTIME+" ["):-1])==target
           need(found,"RUNTIME14_UNAVAILABLE")
           return {"sdkConfiguredAndSelected":SDK,"runtime14Available":True,"actualUnitRuntime":"NOT_OBSERVED"}
          def configuration(config):
           need(type(config) is dict and type(config.get("runtimeOptions")) is dict,"UNIT_RUNTIMECONFIG")
           r=config["runtimeOptions"];need(r.get("tfm")=="net10.0" and r.get("rollForward")=="Disable","UNIT_RUNTIMECONFIG")
           need(("framework" in r)!=("frameworks" in r) and "includedFrameworks" not in r,"UNIT_FRAMEWORK")
           f=[r["framework"]] if "framework" in r else r["frameworks"]
           need(type(f) is list and len(f)==1 and type(f[0]) is dict,"UNIT_FRAMEWORK")
           need(f[0].get("name")=="Microsoft.NETCore.App" and f[0].get("version")==RUNTIME,"UNIT_FRAMEWORK")
           return {"requested":RUNTIME,"rollForward":"Disable","actualUnitRuntime":"NOT_OBSERVED"}
          def child_environment(original,root,host):
           env=dict(original);env.update({"DOTNET_ROLL_FORWARD":"Disable","DOTNET_ROOT":str(root),"DOTNET_ROOT_X64":str(root),"DOTNET_HOST_PATH":str(host)})
           return env
          def unit_command(host,dll,config):
           return [str(host),"exec","--runtimeconfig",str(config),"--fx-version",RUNTIME,"--roll-forward","Disable",str(dll),"-noLogo","-result-xml","artifacts/unit.xml"]
          def actual_xml(b):
           need(type(b) is bytes and 0<len(b)<=8388608 and b"<!DOCTYPE" not in b.upper() and b"<!ENTITY" not in b.upper(),"UNIT_XML")
           try:r=ET.fromstring(b)
           except Exception:raise UnitReject("UNIT_XML")
           a=r.findall("assembly")
           need(r.tag=="assemblies" and len(a)==1 and a[0].get("environment")==ENV14,"UNIT_XML_RUNTIME")
           return {"sdk":SDK,"unitRuntime":RUNTIME,"rollForward":"Disable","evidence":"ACTUAL_UNIT_XML_METADATA_MATCH_ONLY_NOT_FULL_PROOF"}
          def meta(host,args):
           p=subprocess.run([str(host),*args],capture_output=True,timeout=30,check=False)
           need(p.returncode==0 and len(p.stdout)<=65536 and len(p.stderr)<=65536,"SDK_METADATA")
           try:return p.stdout.decode("utf-8-sig")
           except Exception:raise UnitReject("SDK_METADATA")
          def command(args,env=None,timeout=180):
           need(subprocess.run(args,env=env,timeout=timeout,check=False).returncode==0,"UNIT_COMMAND")
          UNIT_CODES={"SDK_SELECTION","RUNTIME14_UNAVAILABLE","UNIT_RUNTIMECONFIG","UNIT_FRAMEWORK","UNIT_XML","UNIT_XML_RUNTIME","SDK_METADATA","UNIT_COMMAND","UNIT_CONTEXT","UNIT_HOST","UNIT_INTERNAL"}
          def unit_diagnostic(error):
           code=error.code if isinstance(error,UnitReject) and error.code in UNIT_CODES else "UNIT_INTERNAL"
           return "CE07_UNIT_CONTROL_REJECT_V1 "+code
          def main():
           root=Path(os.environ["DOTNET_ROOT"]).resolve();osname=os.environ["RUNNER_OS"]
           need(osname in ("Windows","Linux"),"UNIT_CONTEXT")
           host=root/("dotnet.exe" if osname=="Windows" else "dotnet")
           need(host.is_file() and not host.is_symlink(),"UNIT_HOST")
           selection(meta(host,["--version"]),meta(host,["--list-runtimes"]),root,osname)
           command([str(host),"restore","tests/Core.Tests/Core.Tests.csproj","--locked-mode"])
           command([str(host),"build","tests/Core.Tests/Core.Tests.csproj","-c","Release","--no-restore","-p:RollForward=Disable"])
           config=Path("tests/Core.Tests/bin/Release/net10.0/Core.Tests.runtimeconfig.json");dll=config.with_name("Core.Tests.dll")
           need(config.is_file() and not config.is_symlink() and config.stat().st_size<=65536,"UNIT_RUNTIMECONFIG")
           try:configuration(json.loads(config.read_text(encoding="utf-8-sig")))
           except UnitReject:raise
           except Exception:raise UnitReject("UNIT_RUNTIMECONFIG")
           Path("artifacts").mkdir(exist_ok=False)
           command(unit_command(host,dll,config),child_environment(os.environ,root,host),120)
           xml=Path("artifacts/unit.xml")
           need(xml.is_file() and not xml.is_symlink() and xml.stat().st_size<=8388608,"UNIT_XML")
           print("CE07_UNIT_CONTROL_V1 "+json.dumps(actual_xml(xml.read_bytes()),separators=(",",":")))
          if __name__=="__main__":
           try:main()
           except Exception as error:
            print(unit_diagnostic(error),file=sys.stderr);sys.exit(1)
      - name: Fetch exact official Buf tool
        run: python tools/fetch_buf.py --out artifacts/buf
      - name: Build exact clean native package and descriptors
        shell: pwsh
        run: |
          $buf = @(Get-ChildItem artifacts/buf -File | Where-Object { $_.Name -like 'buf-*' })
          if ($buf.Count -ne 1) { throw 'One pinned Buf binary required' }
          python tools/package.py --rid ${{ matrix.rid }} --commit ${{ github.sha }} --work artifacts/build --out artifacts/delivery --buf $buf[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Expression-only dependency notice regressions
        run: python tools/test_notices.py --out artifacts/notices-tests
      - name: Canonical pinned-key and attacker-signature regressions
        run: python tools/test_verifier.py --out artifacts/verifier-tests
      - name: Current advisory data for locked dependencies
        run: python tools/audit_dependencies.py --out artifacts/dependency-advisories.json
      - name: Extract and execute the actual package
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem artifacts/delivery -File)
          if ($archive.Count -ne 1) { throw 'Exactly one archive required' }
          python tools/extract_package.py --archive $archive[0].FullName --out 'artifacts/extracted with spaces'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = @(Get-ChildItem 'artifacts/extracted with spaces' -Directory)
          if ($package.Count -ne 1) { throw 'Exactly one package root required' }
          python tools/check_package.py --package $package[0].FullName --commit '${{ github.sha }}' --out artifacts/package-checks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One frozen preview.2 Linux semantic and migration profile
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $runId = 'ce07-' + [guid]::NewGuid().ToString('N')
          "CE07_PROFILE_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ce07-profile'
          $out = Join-Path $root $runId
          python tools/run_semantic_profile.py --ci --inputs (Join-Path $root inputs) --out $out --run-id $runId
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete fixed profile; retain private diagnostics' }
          # Retain the existing bounded case-summary proof, never raw history.
          $proof = Join-Path $out 'private/integration/receipt.json'
          if ((Get-Item -LiteralPath $proof).Length -gt 262144) { throw 'Legacy summary exceeds bound' }
          $receipt = Get-Content -Raw -LiteralPath $proof | ConvertFrom-Json
          $keys = @('status','clientOs','caseCount','cases','effectCount','total','finalStage','legacyInputGuard','immutableApplicationFiles','normalUnknownResolutionAttempts','durationSeconds')
          if (@(Compare-Object ($receipt.PSObject.Properties.Name | Sort-Object) ($keys | Sort-Object)).Count -ne 0) { throw 'Unexpected legacy summary fields' }
          if ($receipt.status -ne 'PASS' -or $receipt.caseCount -ne 15 -or $receipt.effectCount -ne 52 -or $receipt.total -ne 3556 -or $receipt.finalStage -ne 2) { throw 'Exact profile summary mismatch' }
          New-Item -ItemType Directory -Path artifacts/integration -ErrorAction Stop | Out-Null
          $receipt | ConvertTo-Json -Depth 16 | Set-Content -Encoding utf8 -LiteralPath artifacts/integration/receipt.json
          $public = @('admission.sanitized.json','resource.sanitized.json','semantic-matrix.json','receipt.sanitized.json')
          $bytes = 0
          foreach ($name in $public) {
            $file = Get-Item -LiteralPath (Join-Path $out $name)
            if ($file.Length -gt 262144) { throw 'Sanitized receipt exceeds bound' }
            $bytes += $file.Length
          }
          if ($bytes -gt 1048576) { throw 'Total sanitized proof cap' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: bundle-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - name: Transport complete bounded public proof in job logs
        shell: python
        run: |
          """Inactive runtime/diagnostic amendment. No SDK/product/network activity on import."""
          import base64,hashlib,html,json,math,os,re,stat,sys,xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          from xml.parsers import expat
