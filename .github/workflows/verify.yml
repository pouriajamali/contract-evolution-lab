      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/unit.xml
            artifacts/package-checks.json
            artifacts/dependency-advisories.json
            artifacts/notices-tests/receipt.json
            artifacts/verifier-tests/receipt.json
            artifacts/build/archive.json
            artifacts/build/toolchain-check.json
            artifacts/build/contract-checks/receipt.json
            artifacts/integration/receipt.json
            artifacts/ce07-profile/${{ env.CE07_PROFILE_RUN_ID }}/admission.sanitized.json
            artifacts/ce07-profile/${{ env.CE07_PROFILE_RUN_ID }}/resource.sanitized.json
            artifacts/ce07-profile/${{ env.CE07_PROFILE_RUN_ID }}/semantic-matrix.json
            artifacts/ce07-profile/${{ env.CE07_PROFILE_RUN_ID }}/receipt.sanitized.json
          if-no-files-found: error
  aggregate:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_release == true
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: v0.1.0-preview.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify executed native archives and exact Git source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Attest exact archive digests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: verified-release-candidate
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish tested preview without rebuilding
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
          test "$ACTUAL_TAG" = "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --prerelease --title "$RELEASE_TAG - Contract Evolution & Safe Rollout Lab" --notes-file docs/RELEASE.md
