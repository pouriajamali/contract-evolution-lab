           def walk(e):
            global RULE
            RULE="xml/tree"
            key=e.tag if e.tag in ("assemblies","assembly") else e.attrib.get("name")
            need(key in rules)
            s=rules[key];need(e.tag==s["tag"])
            check(e.attrib,s["attributes"],c,"xml/"+(key if key in ("assembly","assemblies") else str(list(rules).index(key)))+"/@")
            RULE="xml/tree"
            need(not e.text or re.fullmatch("[ \t\r\n]*",e.text) is not None)
            need(not e.tail or re.fullmatch("[ \t\r\n]*",e.tail) is not None)
            children=[x.attrib.get("name",x.tag) for x in e]
            need(Counter(children)==Counter(s["children"]))
            seen.append(key)
            for x in e:walk(x)
           need(root.tag=="assemblies");walk(root)
           need(len(seen)==len(set(seen))==len(rules))
          def validate_files(raw,c):
           global FILE,RULE
           FILE="context";RULE="$"
           identity(c);app=COMMON+(LINUX if c["os"]=="Linux" else [])
           need(set(raw)==set(app))
           need(all(type(b) is bytes and 0<len(b)<=RAW for b in raw.values()))
           need(sum(map(len,raw.values()))<=RAW)
           if c["os"]=="Linux":
            need(all(len(raw[n])<=262144 for n in LINUX[1:]))
            need(sum(len(raw[n]) for n in LINUX[1:])<=1048576)
           parsed={}
           for n in app:
            FILE=n;RULE="$"
            if n=="unit.xml":xml_check(raw[n],c)
            else:
             parsed[n]=parse(raw[n]);check(parsed[n],CONTRACT["json"][c["os"]][n],c)
           FILE="context";RULE="$"
           if c["os"]=="Linux":
            s=parsed["receipt.sanitized.json"];r=parsed["resource.sanitized.json"];m=parsed["semantic-matrix.json"];i=parsed["integration/receipt.json"]
            for field,n in [("inputReceiptSha256","admission.sanitized.json"),("resourceReceiptSha256","resource.sanitized.json"),("matrixReceiptSha256","semantic-matrix.json")]:
             need(s[field]==sha(raw[n]),"Cross-receipt digest mismatch")
            need(s["elapsedSeconds"]==r["elapsedSeconds"])
            need(r["parentPid"] in r["membershipByRole"]["launcher"])
            need(m["binaryIdentityBefore"]==m["binaryIdentityAfter"]==i["immutableApplicationFiles"])
            for case in m["cases"]:
             for res,sql in zip(case["consumerResults"],case["sqlComparisons"]):
              need((res["status"]=="APPLIED")==(sql["comparison"]=="CHANGED"))
              need((sql["beforeSha256"]==sql["afterSha256"])==(sql["comparison"]=="UNCHANGED"))
            need(m["rollback"]["beforeSha256"]==m["rollback"]["afterSha256"])
           return parsed
          def format_bytes(raw,c):
           validate_files(raw,c)
           app=COMMON+(LINUX if c["os"]=="Linux" else [])
           total=sum(map(len,raw.values()));records=[];index=[]
           def add(r):records.append(MARKER+json.dumps(r,separators=(",",":"),ensure_ascii=True))
           add({"record":"begin","identity":c,"entries":13,"files":len(app),"rawBytes":total})
           for n in NAMES:
            if n not in app:
             add({"record":"inapplicable","name":n,"reason":"Linux-only profile"})
             index.append({"name":n,"applicable":False,"reason":"Linux-only profile"})
             continue
            b=raw[n];data=base64.b64encode(b).decode();chunks=(len(data)+CHUNK-1)//CHUNK
            h={"record":"file","name":n,"length":len(b),"sha256":sha(b),"chunks":chunks}
            add(h)
            for j in range(chunks):add({"record":"chunk","name":n,"index":j,"data":data[j*CHUNK:(j+1)*CHUNK]})
            index.append({**{k:v for k,v in h.items() if k!="record"},"applicable":True})
           add({"record":"end","identity":c,"entries":13,"files":len(app),"rawBytes":total})
           log=("\n".join(records)+"\n").encode()
           summary=("<pre>"+html.escape(json.dumps({"protocol":MARKER.strip(),"identity":c,"rawBytes":total,"encodedBytes":len(log),"files":index},indent=2))+"</pre>\n").encode()
           need(len(log)+len(records)<=ENCODED);need(len(summary)<=SUMMARY)
           return log,summary
          def read_files(root,c):
           global FILE,RULE
           FILE="context";RULE="$"
           identity(c);root=Path(root).absolute();need(root.is_dir() and not root.is_symlink())
           def regular(path):
            cur=path
