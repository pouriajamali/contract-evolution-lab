             s=cur.lstat()
             need(not stat.S_ISLNK(s.st_mode) and not (getattr(s,"st_file_attributes",0)&1024))
             if cur==root:break
             need(root in cur.parents);cur=cur.parent
            a=path.stat();need(stat.S_ISREG(a.st_mode) and 0<a.st_size<=RAW)
            with path.open("rb") as f:b=f.read(RAW+1)
            z=path.stat();need(a.st_size==z.st_size==len(b) and a.st_mtime_ns==z.st_mtime_ns)
            return b
           raw={}
           for n in COMMON+(LINUX if c["os"]=="Linux" else []):
            FILE=n;RULE="$"
            relative="artifacts/"+n if n in COMMON or n==LINUX[0] else "artifacts/ce07-profile/"+c["profileRun"]+"/"+n
            raw[n]=regular(root/relative)
           return raw
          def main():
           global FILE,RULE
           FILE="context";RULE="$"
           osn=os.environ["RUNNER_OS"];run=os.environ.get("CE07_PROFILE_RUN_ID","")
           unit="contract-evolution-07-"+run[5:]+".service" if osn=="Linux" else ""
           c=identity({"repository":os.environ["GITHUB_REPOSITORY"],"runId":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"job":os.environ["GITHUB_JOB"],"sourceCommit":os.environ["GITHUB_SHA"],"os":osn,"rid":"linux-x64" if osn=="Linux" else "win-x64","profileRun":run,"unit":unit,"controlGroup":"/system.slice/"+unit if unit else ""})
           workspace=os.environ["GITHUB_WORKSPACE"]
           known="/home/runner/work/contract-evolution-lab/contract-evolution-lab" if osn=="Linux" else "D:/a/contract-evolution-lab/contract-evolution-lab"
           need(workspace.replace("\\","/")==known)
           raw=read_files(workspace,c)
           FILE="context";RULE="$"
           sourcePins={"tools/integration.py":"71b8947e84dd6ae57688b869919fb3759362f9e637839bb320fb8a61041ad3c3","tools/semantic-profile.inputs.json":"a3bcbb964f51f285678ea3e86b0b57d5dc1e4a35c255bee8979fbf82dda337a1"}
           for relative,digest in sourcePins.items():
