            code="IO" if isinstance(error,OSError) else ("PARSE" if isinstance(error,(ValueError,ET.ParseError,expat.ExpatError,UnicodeError)) else ("ENVIRONMENT" if isinstance(error,KeyError) else "INTERNAL"))
            error=Reject(code)
           record={"file":FILE if FILE in NAMES else "context","rulePath":error.path if isinstance(error,Reject) and error.path in PATHS else "$","code":error.code if isinstance(error,Reject) else "INTERNAL"}
           line="CE07_PROOF_REJECT_V1 "+json.dumps(record,separators=(",",":"))
           return line if len(line.encode())<=1024 else 'CE07_PROOF_REJECT_V1 {"file":"context","rulePath":"$","code":"INTERNAL"}'
          def sha(b):return hashlib.sha256(b).hexdigest()
          def unique_pairs(pairs):
           d={}
           for k,v in pairs:
            need(k not in d,"DUPLICATE_PROPERTY")
